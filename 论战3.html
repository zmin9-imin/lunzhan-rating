<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>论战｜赛事评分编辑器</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:#202124;background:#edf1f3}*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto}.editor{background:#fff;padding:18px;margin:12px;border-radius:15px;box-shadow:0 2px 12px #0001}h2{margin:0 0 14px;font-size:19px}h3{font-size:15px;margin:16px 0 8px}label{display:block;font-size:12px;color:#69717a;margin:8px 0 4px}input,textarea,select{width:100%;border:1px solid #d7dce2;border-radius:8px;padding:10px;font:inherit;font-size:14px;background:white;color:#202124}textarea{resize:vertical;min-height:65px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{border:0;border-radius:8px;padding:10px 13px;font-size:14px;cursor:pointer;background:#eef1f5;color:#29313a}button.primary{background:#222;color:white}button.danger{background:#fff0f0;color:#aa3636}button:active{opacity:.7}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.actions>*{flex:1}.hint{font-size:12px;color:#737b83;line-height:1.6}.item-editor{border:1px solid #e4e7eb;padding:12px;border-radius:10px;margin:12px 0}.item-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.item-head strong{font-size:14px}.upload{font-size:12px}.upload input{font-size:12px;padding:7px}.preview-wrap{margin:12px;background:#fff;overflow:hidden}.capture{width:680px;background:#f4f6f7;margin:0 auto;padding-bottom:24px}.match{height:305px;color:#fff;background:radial-gradient(ellipse at 80% 10%,#17224b 0%,transparent 45%),linear-gradient(140deg,#07080b,#111219 65%,#040407);padding:20px 22px 28px;text-align:center}.match-title{font-size:25px;font-weight:700;letter-spacing:1px}.stage{font-size:15px;margin:8px 0 12px}.bo{display:inline-block;color:#171717;background:#dedee0;font-weight:700;border-radius:3px;padding:3px 10px;font-size:18px}.scoreline{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;margin-top:8px}.score{font-size:55px;font-weight:300;white-space:nowrap}.team-top{display:flex;align-items:center;flex-direction:column;gap:9px;font-size:22px}.team-logo{width:78px;height:78px;object-fit:contain;border-radius:50%;background:#ffffff0b}.fallback-logo{width:78px;height:78px;border:2px solid #8da2c9;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff}.scoreboard{background:#fff;border-radius:24px 24px 0 0;margin-top:-14px;position:relative;padding:12px 22px 0}.tabs{display:flex;gap:28px;white-space:nowrap;border-bottom:1px solid #eee;padding:10px 0 15px;color:#9da0a5;font-size:21px}.tabs .active{font-weight:700;color:#191919;border-bottom:4px solid #d52330;padding-bottom:11px;margin-bottom:-19px}.rounds{display:flex;gap:12px;margin:24px 0 18px}.round{padding:9px 16px;background:#f4f6f7;color:#92969c;font-size:18px}.round.active{color:#222;font-weight:700}.teams{display:grid;grid-template-columns:1fr 1fr;background:#f3f6f7;margin-bottom:20px;padding:5px;gap:4px}.team-tab{display:flex;align-items:center;justify-content:center;gap:10px;padding:9px 3px;font-size:20px;color:#9299a3}.team-tab.active{background:white;color:#222}.mini-logo{width:32px;height:32px;object-fit:contain;border-radius:50%}.cards{background:#f4f6f7;padding:1px 0 12px}.card{background:white;margin:17px 0 21px;padding:22px 18px 15px;min-height:195px}.card-main{display:flex;align-items:flex-start;gap:14px}.portrait-box{position:relative;width:94px;height:110px;flex:none}.portrait{width:88px;height:100px;object-fit:cover;object-position:top;background:#eef1f3}.hero{position:absolute;width:43px;height:43px;object-fit:cover;bottom:0;right:-4px;border:2px solid white;background:#d5dbe0}.player-info{min-width:0;flex:1}.player-name{font-weight:700;font-size:20px;margin:2px 0 7px}.kda{color:#a3a7ad;font-size:16px}.tag{display:inline-block;background:#eee9f5;color:#65567c;padding:3px 7px;font-size:14px;margin-top:7px}.rating{width:196px;flex:none;text-align:right}.stars{font-size:30px;letter-spacing:-2px;white-space:nowrap;line-height:1.15;color:#32a9e1}.stars.low{color:#cbd0d8}.rating-num{color:#2aa9e1;font-size:42px;line-height:1.05}.rating-count{font-size:13px;color:#a0a3a7;margin-top:3px}.quote{margin-top:14px;background:#fff9f3;color:#b87f65;display:inline-block;max-width:calc(100% - 30px);font-size:16px;line-height:1.5;padding:4px 9px;overflow-wrap:anywhere}.quote-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.external{color:#9aa0a8;font-size:24px}.foot{font-size:12px;color:#a3a7ae;text-align:center;padding:10px}.filebtn{display:inline-block;border-radius:8px;padding:10px 13px;background:#eef1f5;font-size:13px;cursor:pointer}.filebtn input{display:none}@media(max-width:700px){.preview-wrap{overflow-x:auto}.capture{transform-origin:top left}.editor{margin:10px}.rating{width:180px}.stars{font-size:27px}}

/* V2：与中文 2ch 论坛体生成器统一的米白 + 森林绿配色 */
:root{color:#253129;background:#f1f4f0}
.editor{background:#fff;border:1px solid #d7dfd8;box-shadow:0 2px 10px #152b1710}
label,.hint{color:#68766c}
input,textarea,select{border-color:#cbd5ce;color:#253129}
button,.filebtn{background:#e9efeb;color:#254531}
button.primary{background:#315f46;color:white}
button.danger{background:#9b4b4b;color:white}
.item-editor{border-color:#dce4de;background:#fafcfb}
.preview-wrap{background:#dce5dc}
.capture,.cards{background:#f0f0e5;color:#242b23}
.match{background:radial-gradient(ellipse at 80% 10%,#416e51 0%,transparent 50%),linear-gradient(140deg,#20392b,#315f46 65%,#1c3327);color:#fff}
.bo{background:#e9efeb;color:#254531}
.fallback-logo{border-color:#a3b3a1}
.scoreboard,.card{background:#fafcf6}
.tabs{border-color:#d7dfd8;color:#8c988d}
.tabs .active{color:#23663a;border-color:#315f46}
.round,.teams{background:#e9efeb;color:#68766c}
.round.active,.team-tab.active{color:#23663a}
.team-tab{color:#68766c}.team-tab.active{background:#fafcf6}
.portrait{background:#e9efeb}.hero{background:#dce5dc;border-color:#fafcf6}
.kda,.rating-count,.foot{color:#8c988d}
.tag{background:#e4eee5;color:#315f46}
.stars,.rating-num{color:#16822d}
.stars.low{color:#b7c5b7}
.quote{background:#edf1e7;color:#315f46}
.external{color:#8c988d}
.stars-meter{position:relative;display:inline-block;white-space:nowrap;font-size:30px;letter-spacing:-2px;line-height:1.15;font-weight:400;vertical-align:top}.stars-base{color:#bdc9bd;display:block}.stars-fill{position:absolute;top:0;left:0;overflow:hidden;white-space:nowrap;color:#16822d;display:block}@media(max-width:700px){.stars-meter{font-size:27px}}</style></head><body><div class="app"><section class="editor"><h2>论战 · 电竞赛事评分编辑器</h2><p class="hint">编辑信息会自动保存在当前浏览器。下方是最终导出效果，图片不会包含编辑控件。</p><div class="grid"><div><label>赛事名称</label><input id="event"></div><div><label>比赛阶段</label><input id="stage"></div><div><label>BO 局数</label><input id="bo"></div><div><label>局数标签</label><input id="round"></div><div><label>左队得分</label><input id="score0" type="number"></div><div><label>右队得分</label><input id="score1" type="number"></div></div><h3>队伍资料</h3><div class="grid"><div><label>左队名称</label><input id="team0"><label>左队队徽</label><input type="file" id="logo0" accept="image/*"></div><div><label>右队名称</label><input id="team1"><label>右队队徽</label><input type="file" id="logo1" accept="image/*"></div></div><h3>当前编辑队伍</h3><div class="actions"><button id="switch0">左队</button><button id="switch1">右队</button></div><div id="players"></div><div class="actions"><button class="primary" id="add">＋ 添加选手 / 教练</button></div><h3>导出与备份</h3><div class="actions"><button class="primary" id="png">导出当前队伍 PNG</button><button id="both">分别导出两队 PNG</button></div><div class="actions"><button id="savejson">导出项目 JSON</button><label class="filebtn">导入项目 JSON<input type="file" id="loadjson" accept=".json,application/json"></label></div><p class="hint">首次导出 PNG 需要联网加载截图组件。iPhone Safari 下载后可在「文件」中找到图片。若图片过长，请按需要减少单次选手数量。</p></section><div class="preview-wrap" id="previewWrap"><div class="capture" id="capture"></div></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const initial={event:'KPL 年度总决赛',stage:'淘汰赛',bo:'BO 7',round:'第 5 局',score:[3,2],team:['北京 JDG','广州 TTG'],logo:['',''],active:0,players:[[{name:'光明',kda:'3/2/4',tag:'关键出手',rating:'9.9',count:'7057',comment:'我已经从地狱归来，这一世我要带着队伍走向光明！',portrait:'',hero:''},{name:'清融',kda:'0/3/9',tag:'',rating:'8.4',count:'6607',comment:'前期有点瑕疵，但是后面真的很精彩',portrait:'',hero:''}],[{name:'小胖',kda:'4/1/8',tag:'又香又臭',rating:'4.8',count:'2895',comment:'这局的节奏需要再调整',portrait:'',hero:''},{name:'小雪',kda:'3/2/7',tag:'',rating:'4.1',count:'2734',comment:'这要是道崽就是2分了',portrait:'',hero:''}]]};let data;try{data=JSON.parse(localStorage.getItem('lunzhan-v1'))||structuredClone(initial)}catch{data=structuredClone(initial)}if(!Array.isArray(data.players)||data.players.length!==2)data=structuredClone(initial);let active=data.active||0;function persist(){data.active=active;try{localStorage.setItem('lunzhan-v1',JSON.stringify(data))}catch(e){if(!window.__lunzhanStorageWarned){window.__lunzhanStorageWarned=true;console.warn('论战：本地存储容量不足，当前更改可能未自动保存。请导出 JSON 备份。')}}}function download(blob,name){const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}function fileData(file){return new Promise((res,rej)=>{const r=new FileReader;r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}function syncInputs(){for(const k of ['event','stage','bo','round'])$(k).value=data[k]||'';for(let i=0;i<2;i++){ $('score'+i).value=data.score[i];$('team'+i).value=data.team[i]||'' }$('switch0').textContent='编辑 '+data.team[0];$('switch1').textContent='编辑 '+data.team[1];$('switch0').className=active===0?'primary':'';$('switch1').className=active===1?'primary':''}
function renderEditors(){syncInputs();$('players').innerHTML=data.players[active].map((p,i)=>`<div class="item-editor" data-i="${i}"><div class="item-head"><strong>第 ${i+1} 位 · ${esc(p.name||'未命名')}</strong><div><button data-move="up">↑</button><button data-move="down">↓</button><button class="danger" data-remove="1">删除</button></div></div><div class="grid"><div><label>选手姓名</label><input data-field="name" value="${esc(p.name)}"></div><div><label>K/D/A</label><input data-field="kda" value="${esc(p.kda)}"></div><div><label>评分（0–10）</label><input type="number" step="0.1" min="0" max="10" data-field="rating" value="${esc(p.rating)}"></div><div><label>评分人数</label><input data-field="count" value="${esc(p.count)}"></div><div><label>选手标签（可留空）</label><input data-field="tag" value="${esc(p.tag)}"></div></div><label>评价内容</label><textarea data-field="comment">${esc(p.comment)}</textarea><div class="grid"><div class="upload"><label>选手照片</label><input type="file" data-image="portrait" accept="image/*"></div><div class="upload"><label>英雄头像（可选）</label><input type="file" data-image="hero" accept="image/*"></div></div></div>`).join('')}
function imageOrFallback(src,cl,txt){return src?`<img class="${cl}" src="${src}" crossorigin="anonymous">`:`<div class="${cl}" style="display:flex;align-items:center;justify-content:center;color:#9aa1aa;font-size:13px">${esc(txt)}</div>`}function renderPreview(){const [a,b]=data.team;const logo=i=>data.logo[i]?`<img class="team-logo" src="${data.logo[i]}">`:`<div class="fallback-logo">${esc(data.team[i].slice(0,3))}</div>`;const mini=i=>data.logo[i]?`<img class="mini-logo" src="${data.logo[i]}">`:'';const list=data.players[active].map(p=>{const val=Math.max(0,Math.min(10,Number(p.rating)||0));const fill=(val/10*100).toFixed(1);return `<div class="card"><div class="card-main"><div class="portrait-box">${imageOrFallback(p.portrait,'portrait','照片')}${p.hero?`<img class="hero" src="${p.hero}">`:''}</div><div class="player-info"><div class="player-name">${esc(p.name)}</div><div class="kda">K/D/A:${esc(p.kda)}</div>${p.tag?`<div class="tag">${esc(p.tag)}</div>`:''}</div><div class="rating"><div class="stars-meter" aria-label="${val.toFixed(1)}分，五星制按比例填充"><span class="stars-base">★★★★★</span><span class="stars-fill" style="width:${fill}%">★★★★★</span></div><div class="rating-num">${val.toFixed(1)}</div><div class="rating-count">${esc(p.count)}人评分</div></div></div><div class="quote-row"><div class="quote">${esc(p.comment)}</div><span class="external">↗</span></div></div>`}).join('');$('capture').innerHTML=`<div class="match"><div class="match-title">${esc(data.event)}</div><div class="stage">${esc(data.stage)}</div><span class="bo">${esc(data.bo)}</span><div class="scoreline"><div class="team-top">${logo(0)}<div>${esc(a)}</div></div><div class="score">${esc(data.score[0])} - ${esc(data.score[1])}</div><div class="team-top">${logo(1)}<div>${esc(b)}</div></div></div></div><div class="scoreboard"><div class="tabs"><span>讨论</span><span>本命擂台</span><span class="active">论战评分</span><span>预测广场</span></div><div class="rounds"><span class="round active">${esc(data.round)}</span><span class="round">第 4 局</span><span class="round">第 3 局</span><span class="round">第 2 局</span></div><div class="teams"><div class="team-tab ${active===0?'active':''}">${mini(0)}${esc(a)}</div><div class="team-tab ${active===1?'active':''}">${mini(1)}${esc(b)}</div></div></div><div class="cards">${list||'<div class="foot">暂无选手，请在上方添加</div>'}</div><div class="foot">论战 · 赛事评分</div>`;fitPreview()}
function fitPreview(){const wrap=$('previewWrap'),capture=$('capture');const scale=Math.min(1,(wrap.clientWidth||680)/680);capture.style.transform=`scale(${scale})`;capture.style.marginLeft='0';wrap.style.height=Math.ceil(capture.scrollHeight*scale)+'px'}function rerender(){persist();renderPreview()}for(const k of ['event','stage','bo','round'])$(k).addEventListener('input',e=>{data[k]=e.target.value;rerender()});for(let i=0;i<2;i++){ $('score'+i).addEventListener('input',e=>{data.score[i]=e.target.value;rerender()});$('team'+i).addEventListener('input',e=>{data.team[i]=e.target.value;rerender()});$('logo'+i).addEventListener('change',async e=>{if(e.target.files[0]){data.logo[i]=await fileData(e.target.files[0]);rerender()}});$('switch'+i).onclick=()=>{active=i;persist();renderEditors();renderPreview()}}$('players').addEventListener('input',e=>{const field=e.target.dataset.field;if(field){const i=Number(e.target.closest('.item-editor').dataset.i);data.players[active][i][field]=e.target.value;rerender()}});$('players').addEventListener('change',async e=>{const field=e.target.dataset.image;if(field&&e.target.files[0]){const i=Number(e.target.closest('.item-editor').dataset.i);data.players[active][i][field]=await fileData(e.target.files[0]);rerender()}});$('players').addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;const i=Number(btn.closest('.item-editor').dataset.i),arr=data.players[active];if(btn.dataset.remove){if(!confirm('删除这位选手？'))return;arr.splice(i,1)}else if(btn.dataset.move){const j=i+(btn.dataset.move==='up'?-1:1);if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]]}persist();renderEditors();renderPreview()});$('add').onclick=()=>{data.players[active].push({name:'新选手',kda:'0/0/0',tag:'',rating:'8.0',count:'0',comment:'在这里输入评价',portrait:'',hero:''});persist();renderEditors();renderPreview();$('players').lastElementChild.scrollIntoView({behavior:'smooth',block:'center'})};async function exportPNG(i){const old=active;active=i;renderPreview();await new Promise(r=>setTimeout(r,250));if(!window.html2canvas){alert('图片导出组件未加载，请联网后刷新页面重试。');active=old;renderPreview();return}try{const el=$('capture');const prev=el.style.transform;el.style.transform='none';const canvas=await html2canvas(el,{scale:2,useCORS:true,backgroundColor:'#f4f6f7',width:680,windowWidth:1000,scrollX:0,scrollY:-window.scrollY});el.style.transform=prev;const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));if(blob)download(blob,`论战_${data.team[i]}_评分.png`)}catch(err){alert('导出失败：'+err.message)}finally{active=old;renderEditors();renderPreview()}}$('png').onclick=()=>exportPNG(active);$('both').onclick=async()=>{await exportPNG(0);await new Promise(r=>setTimeout(r,900));await exportPNG(1)};$('savejson').onclick=()=>download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'论战_赛事评分项目.json');$('loadjson').onchange=async e=>{if(!e.target.files[0])return;try{const obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj.players)||obj.players.length!==2)throw Error('格式不正确');data=obj;active=obj.active||0;persist();renderEditors();renderPreview();alert('导入成功')}catch(err){alert('导入失败：'+err.message)}};window.addEventListener('resize',fitPreview);renderEditors();renderPreview();
</script></body></html>
